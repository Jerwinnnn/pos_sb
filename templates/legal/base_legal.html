<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Legal{% endblock %} — {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family={{ font_url }}&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('theme_css') }}">
  <style>
    body { background: var(--menu-bg); }
    .legal-wrap { max-width: 760px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    .legal-nav { display:flex; align-items:center; gap:.75rem; margin-bottom:2rem; font-size:.875rem; }
    .legal-nav a { color: var(--brand); font-weight: 600; }
    .legal-nav-sep { color: var(--text-dark-3); }
    .legal-header { margin-bottom:2rem; padding-bottom:1.25rem; border-bottom:1.5px solid var(--menu-border); }
    .legal-header h1 { font-size:1.75rem; font-weight:800; color:var(--text-dark); margin-bottom:.25rem; }
    .legal-meta { font-size:.8125rem; color:var(--text-dark-3); }
    .legal-body h2 { font-size:1.0625rem; font-weight:800; color:var(--text-dark); margin:1.75rem 0 .5rem; }
    .legal-body h3 { font-size:.9375rem; font-weight:700; color:var(--text-dark-2); margin:1.25rem 0 .375rem; }
    .legal-body p { font-size:.9375rem; color:var(--text-dark-2); line-height:1.7; margin-bottom:.875rem; }
    .legal-body ul,.legal-body ol { padding-left:1.5rem; margin-bottom:.875rem; }
    .legal-body li { font-size:.9375rem; color:var(--text-dark-2); line-height:1.7; margin-bottom:.3rem; }
    .legal-body a { color: var(--brand); }
    .legal-body table{width:100%;border-collapse:collapse;font-size:.875rem;margin-bottom:1rem}
    .legal-body th{text-align:left;padding:.5rem .75rem;color:var(--text-dark);border-bottom:2px solid var(--menu-border)}
    .legal-body td{padding:.5rem .75rem;color:var(--text-dark-2);border-bottom:1px solid var(--menu-border)}
    .legal-highlight { background:var(--brand-dim); border-left:3px solid var(--brand);
      border-radius:0 var(--r-sm) var(--r-sm) 0; padding:.75rem 1rem; margin-bottom:1rem;
      font-size:.875rem; color:var(--text-dark-2); }
    .legal-footer-links { display:flex; flex-wrap:wrap; gap:.5rem 1.25rem; margin-top:2.5rem;
      padding-top:1.25rem; border-top:1.5px solid var(--menu-border); font-size:.8125rem; }
    .legal-footer-links a { color:var(--text-dark-3); cursor:pointer; }
    .legal-footer-links a:hover { color:var(--brand); }
  </style>
</head>
<body>
<div class="legal-wrap">
  <nav class="legal-nav" aria-label="Breadcrumb">
    <a href="{{ url_for('login') }}">{{ app_name }}</a>
    <span class="legal-nav-sep" aria-hidden="true">/</span>
    <span>{% block breadcrumb %}Legal{% endblock %}</span>
  </nav>

  <div class="legal-header">
    <h1>{% block heading %}{% endblock %}</h1>
    <p class="legal-meta">{% block meta %}Effective date: September 13, 2026{% endblock %}</p>
  </div>

  <div class="legal-body">
    {% block content %}{% endblock %}
  </div>

  <div class="legal-footer-links">
    <a onclick="openPolicyModal('{{ url_for('privacy_policy') }}','Privacy Policy')">Privacy Policy</a>
    <a onclick="openPolicyModal('{{ url_for('terms') }}','Terms &amp; Conditions')">Terms &amp; Conditions</a>
    <a onclick="openPolicyModal('{{ url_for('cookie_policy') }}','Cookie Policy')">Cookie Policy</a>
    <a onclick="openPolicyModal('{{ url_for('refund_policy') }}','Refund Policy')">Refund Policy</a>
    <a href="{{ url_for('login') }}">Back to Sign In</a>
  </div>
</div>
<script src="{{ url_for('static', filename='js/policy_modal.js') }}"></script>
</body>
</html>
