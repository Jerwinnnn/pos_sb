<style>
  .legal-body h2{font-size:1rem;font-weight:800;color:#1a1c22;margin:1.5rem 0 .4rem}
  .legal-body h3{font-size:.9375rem;font-weight:700;color:#4a4f5c;margin:1.125rem 0 .3rem}
  .legal-body p{font-size:.9rem;color:#4a4f5c;line-height:1.7;margin-bottom:.75rem}
  .legal-body ul,.legal-body ol{padding-left:1.5rem;margin-bottom:.75rem}
  .legal-body li{font-size:.9rem;color:#4a4f5c;line-height:1.7;margin-bottom:.25rem}
  .legal-body a{color:#e83b2a}
  .legal-body table{width:100%;border-collapse:collapse;font-size:.85rem;margin-bottom:1rem}
  .legal-body th{text-align:left;padding:.45rem .65rem;color:#1a1c22;border-bottom:2px solid #e8e2d9}
  .legal-body td{padding:.45rem .65rem;color:#4a4f5c;border-bottom:1px solid #e8e2d9}
  .legal-highlight{background:rgba(232,59,42,.07);border-left:3px solid #e83b2a;
    border-radius:0 6px 6px 0;padding:.7rem .9rem;margin-bottom:1rem;
    font-size:.875rem;color:#4a4f5c}
</style>
<div class="legal-body">{% block content %}{% endblock %}</div>
